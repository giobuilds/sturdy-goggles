<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fit Log">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/app.css">
<title>{{.Title}} · Fit Log</title>
</head>
<body{{if .Player}} class="player-page"{{end}}>
<header class="top">
  <a href="/" class="brand">Fit Log</a>
  <nav>
    <a href="/start">Start</a>
    <a href="/sessions">History</a>
  </nav>
</header>
<main>
{{template "content" .}}
</main>
<div id="pending" class="pending" hidden></div>
<script src="/static/app.js" defer></script>
{{if .Player}}<script src="/static/player.js" defer></script>{{end}}
</body>
</html>
